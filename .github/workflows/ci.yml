name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Skill metadata and generated evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check skill metadata, versions, and style
        run: python3 -I scripts/check_skill.py
      - name: Check generated eval cases are up to date
        run: |
          python3 -I evals/generate.py evals --force
          if [ -n "$(git status --porcelain -- evals)" ]; then
            git status --porcelain -- evals
            echo "::error::evals/ is out of sync with evals/generate.py. Run: python3 -I evals/generate.py evals --force"
            exit 1
          fi

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.323
      - run: claude plugin validate . --strict

  markdown:
    name: Markdown and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.1 "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude "^https://github.com/CelikE/prompt-refiner-skill"
            --exclude "^https://img.shields.io"
            "**/*.md"
          fail: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The CLI scans the full history. gitleaks-action scans a commit range,
      # which breaks on pushes that include the root commit.
      # The tarball is checked against the SHA-256 from the release's checksum
      # file before anything is unpacked. Update both when bumping the version.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

name: Evals

# Paid: every run calls the Anthropic API. Manual trigger only, so pull requests
# from forks never spend the maintainer's credit.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Case name glob
        default: "*"
      runs:
        description: "Runs per case and arm (empty: each case's own count, 3 or 10)"
        default: ""
      model:
        description: "Model alias or id, e.g. opus, sonnet, haiku (empty: Claude Code default)"
        default: ""
      max_cost_usd:
        description: "Hard cost ceiling in USD (a full Opus run cost about $19 in November 2026)"
        default: "30"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ inputs.cases }}
          RUNS: ${{ inputs.runs }}
          MODEL: ${{ inputs.model }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        shell: bash
        run: |
          args=(plugin eval . --case "$CASES" -j 6 --scaffold --allow-tools Edit Write
                --trust-plugin --keep-temp --max-cost-usd "$MAX_COST_USD"
                --json evals/results/run.json)
          # Without --runs each case uses its own count: 10 for the risky cases, 3 for the rest.
          if [ -n "$RUNS" ]; then args+=(--runs "$RUNS"); fi
          # Pin the model so a model rollout is not mistaken for a skill regression.
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          claude "${args[@]}"
      # --keep-temp leaves each run's transcript in a temp directory. Copy them
      # into evals/results/traces/ so the uploaded artifact can be audited.
      - name: Collect transcripts
        if: always()
        run: python3 -I scripts/collect_traces.py evals/results/run.json
      # Format checks are not part of the score, so the eval command does not
      # fail on them. The summary script does, and prints the results table.
      - name: Summarise and gate on behaviour and format checks
        if: always()
        shell: bash # explicit bash sets pipefail, so the check's exit code survives tee
        run: python3 -I scripts/summarize_results.py evals/results/run.json --check --save evals/results/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/

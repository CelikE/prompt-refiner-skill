name: Evals

# Paid: every run calls the Anthropic API. Manual trigger only, so pull requests
# from forks never spend the maintainer's credit.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Case name glob
        default: "*"
      runs:
        description: Runs per case
        default: "3"
      max_cost_usd:
        description: Hard cost ceiling in USD
        default: "20"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ inputs.cases }}
          RUNS: ${{ inputs.runs }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: >-
          claude plugin eval .
          --case "$CASES"
          --runs "$RUNS"
          -j 6
          --allow-tools Edit Write
          --trust-plugin
          --max-cost-usd "$MAX_COST_USD"
          --json evals/results/run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
